# We have a conf and classes directory, add to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hilscher-netfield-phytec"
BBFILE_PATTERN_hilscher-netfield-phytec := "^${LAYERDIR}/"
BBFILE_PRIORITY_hilscher-netfield-phytec = "100"

LAYERSERIES_COMPAT_hilscher-netfield-phytec = "kirkstone"
LAYERDEPENDS_hilscher-netfield-phytec = " \
	core yocto hilscher-netfield freescale-layer fsl-bsp-release gplv2 \
	security tpm-layer openembedded-layer multimedia-layer networking-layer perl-layer meta-python \
	webserver swupdate \
"

KEYS_DIR := "${LAYERDIR}/keys"

BSP_DEPLOYSCRIPT_DIR = "${LAYERDIR}/scripts/deploy"
