#@TYPE: Machine
#@NAME: netFIELD Quantum Rev.1
#@DESCRIPTION:
#@PARTNUMBERS: 1918.016
#@MAINTAINER: Hilscher Gesellschaft fuer Systemautomation mbH
#@TEMPLATECONF: meta-hilscher-netfield-phytec/conf/samples

PHYSICAL_SYSTEM_DEVICE ?= "/dev/mmcblk1"

#-------------------------------------------------------------------------------
require conf/machine/phyboard-pollux-imx8mp-3.conf
MACHINEOVERRIDES =. "phyboard-pollux-imx8mp-3:"
KERNEL_DEVICETREE = "freescale/netfield-quantum-rev1.dtb"

UBOOT_DTB_NAME = "netfield-quantum-rev1.dtb"

BOOTLOADER_SEEK:${MACHINE} = "32"
#-------------------------------------------------------------------------------
require include/phytec_common.inc

PRECONFIGURED_SYSTEM_CONNECTIONS ?= "eth0 eth1"

MACHINE_FEATURES += "pci wifi 3g hab"
# TODO: MACHINE_FEATURES += "preempt_rt"

# No cifx connected via SPI
CIFX_SPI_CONFIGS = ""

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " kernel-module-netanalyzer libnetana netanalyzer-firmware netanalyzer-bsl"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append = " uionetx"


# Don't install some recommended packages, into rescue image
BAD_RECOMMENDATIONS:pn-hilscher-rescue-image += " \
    kernel-module-netanalyzer libnetana netanalyzer-firmware netanalyzer-bsl \
    kernel-module-uio-netx \
    kernel-5.15* \
"

SWU_FILES += "${IMAGE_BOOTLOADER};boot.bin"
SWU_FILE_ATTRIBUTES += "boot.bin;path=\"/dev/mmcblk1\";offset=\"${BOOTLOADER_SEEK}K\";name=\"boot.bin\";version;install-if-different=true"

# UBOOT_ENTRYPOINT:mx8m-generic-bsp = "0x40800000"
UBOOT_ENTRYPOINT:mx8m-generic-bsp = "0x58000000"
UBOOT_DTB_LOADADDRESS:mx8m-generic-bsp = "0x48000000"
